name: iOS Test IPA

on:
  push:
    branches:
      - test/ios-1.0.3-sleep-fix
    paths:
      - ios/**
      - .github/workflows/ios-test-ipa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-test-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build iOS device IPA (re-sign before installation)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up XcodeGen and record toolchain
        run: |
          set -euo pipefail
          mkdir -p build/logs build/artifacts
          xcodebuild -version | tee build/logs/xcode-version.txt
          xcrun swift --version | tee build/logs/swift-version.txt
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version | tee build/logs/xcodegen-version.txt

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive the iPhone device app without Apple signing
        run: |
          set -euo pipefail
          if xcodebuild archive \
            -project ios/AndroidTVRemote.xcodeproj \
            -scheme AndroidTVRemote \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/AndroidTVRemote.xcarchive" \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            ONLY_ACTIVE_ARCH=NO \
            > build/logs/archive.log 2>&1; then
            tail -n 5 build/logs/archive.log
          else
            tail -n 100 build/logs/archive.log
            exit 1
          fi

      - name: Package and validate unsigned IPA
        id: package
        run: |
          set -euo pipefail
          exec > >(tee build/logs/package.log) 2>&1
          APP="$PWD/build/Payload/AndroidTVRemote.app"
          mkdir -p build/Payload
          ditto build/AndroidTVRemote.xcarchive/Products/Applications/AndroidTVRemote.app "$APP"
          EXTENSION="$APP/PlugIns/AndroidTVRemoteControls.appex"
          test -d "$EXTENSION"
          xcrun lipo -verify_arch arm64 "$APP/AndroidTVRemote"
          xcrun lipo -verify_arch arm64 "$EXTENSION/AndroidTVRemoteControls"
          plutil -lint "$APP/Info.plist" "$EXTENSION/Info.plist"

          # No Apple signing or provisioning. The user must sign the app,
          # extension and embedded frameworks before installing on an iPhone.
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          NAME="GoogleTVRemote-${VERSION}-sleep-fix-${GITHUB_SHA:0:7}-unsigned"
          IPA_PATH="$PWD/build/artifacts/$NAME.ipa"
          (cd build && /usr/bin/zip -qry "$IPA_PATH" Payload)
          unzip -t "$IPA_PATH" > build/logs/ipa-validation.txt
          (cd build/artifacts && shasum -a 256 "$NAME.ipa" > SHA256SUMS.txt)
          cp ios/AndroidTVRemote/AndroidTVRemote.entitlements build/artifacts/app.entitlements.plist
          cp ios/AndroidTVRemoteControls/AndroidTVRemoteControls.entitlements build/artifacts/widget.entitlements.plist
          printf 'Repository: %s\nBranch: %s\nCommit: %s\nRun: %s/%s/actions/runs/%s\nSigning: unsigned; provision before installation\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            > build/artifacts/build-source.txt
          cat > build/artifacts/README.txt <<'TEXT'
          Google TV Remote - sleep-fix test IPA

          Release build for a physical iPhone (arm64), not the Simulator.
          Includes the app, widget extension and embedded frameworks.
          UNSIGNED: sign and provision the app, extension and frameworks before installation.
          Original entitlements are provided as sidecar plist files. Preserve a matching,
          provisioned App Group on the app and widget for shared data to work.
          No Apple signing credentials were used. No physical iPhone/TV test was performed.
          The sleep-fix application source and existing Keep Ready configuration are unchanged.
          See build-source.txt and SHA256SUMS.txt for source identity and integrity.
          TEXT
          echo "artifact_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Record supplementary build metadata
        continue-on-error: true
        env:
          IPA_PATH: ${{ steps.package.outputs.ipa_path }}
        run: |
          set -euo pipefail
          exec > >(tee build/logs/metadata.log) 2>&1
          RESOLVED=ios/AndroidTVRemote.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if [ -f "$RESOLVED" ]; then
            cp "$RESOLVED" build/artifacts/Package.resolved
          fi
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import pathlib
          import plistlib
          import zipfile

          ipa = pathlib.Path(os.environ['IPA_PATH'])
          with zipfile.ZipFile(ipa) as archive:
              bundles = {}
              for path in ('Payload/AndroidTVRemote.app/Info.plist',
                           'Payload/AndroidTVRemote.app/PlugIns/AndroidTVRemoteControls.appex/Info.plist'):
                  info = plistlib.loads(archive.read(path))
                  bundles[path] = {key: info.get(key) for key in (
                      'CFBundleIdentifier', 'CFBundleShortVersionString', 'CFBundleVersion',
                      'CFBundleExecutable', 'MinimumOSVersion', 'CFBundleSupportedPlatforms')}
          manifest = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'branch': os.environ['GITHUB_REF_NAME'],
              'commit': os.environ['GITHUB_SHA'],
              'created_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'file': ipa.name,
              'sha256': hashlib.sha256(ipa.read_bytes()).hexdigest(),
              'bytes': ipa.stat().st_size,
              'configuration': 'Release',
              'sdk': 'iphoneos',
              'destination': 'generic/platform=iOS',
              'signing': 'Unsigned; sign and provision before installation.',
              'physical_device_tested': False,
              'bundles': bundles,
          }
          (ipa.parent / 'build-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload IPA and build provenance
        id: upload
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: build/artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Write download summary
        if: ${{ steps.upload.outcome == 'success' }}
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo '## iOS sleep-fix IPA'
            echo
            echo "[Download IPA and build provenance]($ARTIFACT_URL)"
            echo
            echo "Source commit: \`$GITHUB_SHA\`"
            echo
            echo '**Unsigned: sign and provision before installation.** App and widget included.'
            echo
            echo 'Physical iPhone/TV sleep behavior has not been tested by CI.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/logs/
          if-no-files-found: warn
          retention-days: 7
